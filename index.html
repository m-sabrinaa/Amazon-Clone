<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo border">
            </div>


            <div class="nav-address border">
                <div class="add-fir">
                    <p>Deliver to</p>
                </div>
                <div class="add-sec">
                    <i class="fa-solid fa-location-dot"></i>
                    <p>Bangladesh</p>
                </div>
            </div>


            <div class="nav-search">
                <select class="search-select">All</select>
                <input type="text" placeholder="Search Amazon" class="search-input">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                
            </div>


            <div class="nav-flag-select border">

                <i class="fa-solid fa-flag-usa" class = "flag"></i>
                <p class = "flag"> EN </p>

                <select class="flag-select">  
                </select>
            </div>

            
            <!-- hello box -->

            <div class="nav-hello border">
                <div class="hello">
                    <p>Hello, sign in</p>
                </div>
                <div class="account">
                    <p><b>Accounts & Lists</b></p>
                    <select class = "account-select"></select>
                </div>
            </div>

            <!-- nav return -->

            <div class="nav-return border">
                <div class="hello">
                    <p>Return</p>
                </div>
                <div class="account">
                    <p><b>& Orders</b></p>
                </div>
            </div>


            <!-- nav cart -->

            <div class="nav-cart border">
                <i class="fa-solid fa-cart-shopping cart-icon"></i>
                <p class="account bottom"><b>Cart</b></p>
            </div>
        </div>

        <!-- panel -->

        
        <div class="panel">
            <div class="menu border">

                <i class="fa-solid fa-bars"></i>
                <p>All</p>

            </div>
            <div class="options">
                <p class="border">Gift Card<p>
                <p class="border">Registry<p>
                <p class="border">Sell<p>
                <p class="border">Prime Video<p>
                <p class="border">Customer Service<p>
            </div>
        </div>
    </header>

    <!-- HERO SECTION -->

    <div class="hero">

        <div class="hero-msg">
            <p>You are on amazon.com. You can also shop on Amazon Bangladesh with millions of producs with fast local delivery. <a href="#">Click here to go to amazon.bd</a></p>
        </div>
    </div>

</body>
</html>
